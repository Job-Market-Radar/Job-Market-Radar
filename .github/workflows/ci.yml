name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Install dependencies
        run: pip install -r api/requirements.txt -r api/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        working-directory: api
        run: python -m pytest

  test-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Install dependencies
        run: pip install -r ai/requirements.txt pytest httpx
      - name: Test
        working-directory: ai
        run: python -m pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -t job-market-radar-api:${{ github.sha }} ./api
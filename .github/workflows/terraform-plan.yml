name: Terraform plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::885069197789:role/jmr-gha-plan
          aws-region: eu-north-1

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        continue-on-error: true
        run: terraform plan -no-color -input=false -lock-timeout=60s 2>&1 | tee plan.txt

      - name: Comment on the PR
        if: always() && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform plan: ${{ steps.plan.outcome }}"
            echo
            echo '<details><summary>Show plan</summary>'
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md

      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1